name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }}${{ matrix.variant && format(' ({0})', matrix.variant) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.9'
          - python: '3.9'
            variant: scrapyd-v143
            scrapyd: 'scrapyd==1.4.3'
          - python: '3.10'
            variant: sqlite
            database: sqlite
          - python: '3.10'
            variant: postgresql
            database: postgresql
          - python: '3.10'
            variant: mysql
            database: mysql
          - python: '3.11'
          - python: '3.12'
          - python: '3.12'
            variant: scrapyd-v143
            scrapyd: 'scrapyd==1.4.3'
          - python: '3.13'

    services:
      # Service containers can't be toggled per matrix entry, so both always start;
      # only the jobs that set DATABASE_URL below actually use them.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scrapydweb
          POSTGRES_PASSWORD: passw0rd
          POSTGRES_DB: scrapydweb
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpw
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -prootpw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SCRAPYDWEB_TESTMODE: 'True'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-tests.txt

      - name: Configure database
        run: |
          case "${{ matrix.database }}" in
            sqlite)
              echo "DATA_PATH=$GITHUB_WORKSPACE/scrapydweb_data" >> "$GITHUB_ENV"
              echo "DATABASE_URL=sqlite:///$GITHUB_WORKSPACE/scrapydweb_database" >> "$GITHUB_ENV"
              ;;
            postgresql)
              echo "DATABASE_URL=postgresql://scrapydweb:passw0rd@127.0.0.1:5432" >> "$GITHUB_ENV"
              ;;
            mysql)
              echo "DATABASE_URL=mysql://root:rootpw@127.0.0.1:3306" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Install dependencies
        run: |
          # psycopg2 builds from source and needs pg_config
          command -v pg_config || sudo apt-get install -y libpq-dev
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-tests.txt
          # PyMySQL needs it for MySQL 8's default caching_sha2_password auth
          pip install cryptography
          # The demo spiders in tests/data only start their requests on Scrapy < 2.13,
          # which in turn needs a Twisted from before 25
          pip install "scrapy<2.13" "twisted<25"
          pip install -e .

      - name: Install ${{ matrix.scrapyd }}
        if: matrix.scrapyd
        run: pip install "${{ matrix.scrapyd }}"

      - run: pip list

      - name: Launch Scrapyd
        run: |
          # The tests read Scrapyd's logs from ~/logs
          mkdir -p ~/logs
          cd ~
          printf "[scrapyd]\nusername = admin\npassword = 12345\n" > scrapyd.conf
          nohup scrapyd > ~/scrapyd.log 2>&1 &
          for i in $(seq 30); do
            curl -sf -u admin:12345 http://127.0.0.1:6800/daemonstatus.json && exit 0
            sleep 1
          done
          cat ~/scrapyd.log
          exit 1

      - name: Lint
        # Known failure on master: F821 undefined names 'datas' and 'sort' in
        # scrapydweb/views/files/log.py (from 0576036). Reported but not blocking until that is fixed.
        continue-on-error: true
        run: flake8 . --count --exclude=./venv* --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        run: coverage run --source=scrapydweb -m pytest -s -vv -l --disable-warnings tests

      - name: Coverage report
        if: always()
        run: |
          coverage report
          coverage html
          coverage xml

      - name: Scrapyd log
        if: failure()
        run: cat ~/scrapyd.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-py${{ matrix.python }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}
          path: |
            htmlcov
            coverage.xml
          if-no-files-found: ignore
