<style>
/* The table renders the header before the sort carets: shows the filter arrow after them,
   as in the columns filtered by the table */
.el-table th > .cell:has(> .column-filter) {
  display: flex;
  align-items: center;
}
.el-table th.is-center > .cell:has(> .column-filter) {justify-content: center;}
.column-filter, .column-filter > span {display: contents;}
.column-filter .el-table__column-filter-trigger {order: 1;}
.el-table__column-filter-trigger i.column-filter-active {color: #409EFF;}
.column-filter-options {
  max-height: 280px;
  overflow-y: auto;
  padding-top: 10px;
}
.column-filter-options .el-checkbox {
  display: block;
  margin: 0 5px 8px 5px;
}
.column-filter-options .el-checkbox + .el-checkbox {margin-left: 5px;}
.column-filter-footer {
  border-top: 1px solid #ebeef5;
  margin-top: 2px;
}
</style>

<script>
// The header of a filtered column: checking some of the values listed keeps only their rows,
// typing a name or part of it narrows down the values listed. They are rendered only while shown, hundreds at times.
Vue.component('column-filter', {
  props: {label: String, options: Array, checked: Array, visible: Boolean},
  data() {
    return {query: ''};
  },
  computed: {
    // The values matching the query, plus the checked ones, so that they can still be unchecked
    shownOptions() {
      const query = this.query.trim().toLowerCase();
      return this.options.filter(option => option.toLowerCase().includes(query) || this.checked.includes(option));
    },
  },
  watch: {
    visible(visible) {  // every time it is shown, the whole list is
      if (!visible) {
        this.query = '';
      }
    },
  },
  template: `
    <span class="column-filter">{{label}}<el-popover placement="bottom" trigger="manual" :value="visible" @after-enter="$refs.input.focus()">
      <el-input ref="input" v-model="query" size="mini" clearable placeholder="Type a name or part of it"
        @keyup.esc.native="$emit('close')"></el-input>
      <el-checkbox-group v-if="visible" class="column-filter-options" :value="checked" @input="$emit('check', $event)">
        <el-checkbox v-for="option in shownOptions" :key="option" :label="option">{{option}}</el-checkbox>
      </el-checkbox-group>
      <div class="column-filter-footer"><el-button type="text" size="mini" @click="query = ''; $emit('check', [])">reset</el-button></div>
      <span slot="reference" class="el-table__column-filter-trigger" @click.stop="$emit('toggle')">
        <i :class="[visible ? 'el-icon-arrow-up' : 'el-icon-arrow-down', {'column-filter-active': checked.length}]"></i>
      </span>
    </el-popover></span>`,
});

// Filters the tableData from the headers rendered by renderFilterHeader. Their columns take :filters="[]",
// so that only the sort carets sort them, the table adding no filter of its own.
// filterColumns, by column-key: a function returning the values of a row listed to be checked.
// The values checked are kept in the query of the URL, by column-key, so that they stay checked
// in the other pages of the table (see urlWith) and after a reload.
function columnFiltersMixin(filterColumns) {
  return {
    data() {
      const query = new URLSearchParams(location.search);
      const filteredValues = {};  // column-key: the values checked in its filter
      for (const columnKey of Object.keys(filterColumns)) {
        if (query.getAll(columnKey).length) {
          filteredValues[columnKey] = query.getAll(columnKey);
        }
      }
      return {
        filteredValues: filteredValues,
        openFilter: null,  // the column-key of the filter shown
      };
    },

    mounted() {
      // A click outside of the filter shown closes it, the clicks inside its popover don't reach the document
      document.addEventListener('click', () => { this.openFilter = null; });
    },

    watch: {
      filteredValues(filteredValues) {
        const query = new URLSearchParams(location.search);
        for (const columnKey of Object.keys(filterColumns)) {
          query.delete(columnKey);
          (filteredValues[columnKey] || []).forEach(value => query.append(columnKey, value));
        }
        history.replaceState(history.state, '', location.pathname + (String(query) ? '?' + query : ''));
      },
    },

    computed: {
      filteredTableData() {
        return this.tableData.filter(row => this.passesFilters(row));
      },
      // The values listed in a column's filter: those of the rows that pass the filters of the other columns,
      // plus the values checked in it, so that they can still be unchecked
      filterOptions() {
        const options = {};
        for (const [columnKey, rowValues] of Object.entries(filterColumns)) {
          const values = this.tableData.filter(row => this.passesFilters(row, columnKey)).map(rowValues).flat();
          options[columnKey] = [...new Set(values.concat(this.filteredValues[columnKey] || []))]
            .sort((a, b) => a.localeCompare(b, undefined, {numeric: true}));
        }
        return options;
      },
    },

    methods: {
      clearFilters() {
        this.filteredValues = {};
        this.openFilter = null;
      },
      // The URL of this page with the query params given set, or deleted if null, keeping the others
      urlWith(params) {
        const query = new URLSearchParams(location.search);
        for (const [key, value] of Object.entries(params)) {
          value === null ? query.delete(key) : query.set(key, value);
        }
        return location.pathname + '?' + query;
      },
      renderFilterHeader(h, {column}) {
        const columnKey = column.columnKey;
        return h('column-filter', {
          props: {
            label: column.label,
            options: this.filterOptions[columnKey],
            checked: this.filteredValues[columnKey] || [],
            visible: this.openFilter === columnKey,
          },
          on: {
            toggle: () => { this.openFilter = this.openFilter === columnKey ? null : columnKey; },
            close: () => { this.openFilter = null; },
            check: values => { this.filteredValues = Object.assign({}, this.filteredValues, {[columnKey]: values}); },
          },
        });
      },
      // Whether a row passes the filters of all the columns but the one of exceptColumnKey
      passesFilters(row, exceptColumnKey) {
        return Object.keys(filterColumns).every(columnKey =>
          columnKey === exceptColumnKey || this.passesFilter(row, columnKey));
      },
      passesFilter(row, columnKey) {
        const checked = this.filteredValues[columnKey] || [];
        return !checked.length || filterColumns[columnKey](row).some(value => checked.includes(value));
      },
    },
  };
}
</script>
